{% extends 'base.html' %}

{% block title %}Login - SafeAlert{% endblock %}

{% block content %}
<div class="sa-auth-wrap">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow sa-auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center sa-icon-badge" style="background: rgba(37, 99, 235, 0.10); border-color: rgba(37, 99, 235, 0.14);">
                            <i class="bi bi-box-arrow-in-right text-primary fs-4"></i>
                        </div>
                        <h4 class="mt-3 mb-1 fw-bold">Welcome back</h4>
                        <p class="text-muted mb-0">Sign in to view and manage your reports.</p>
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                            <div class="text-end mt-1">
                                <small><a href="/forgot-password" class="text-decoration-none">Forgot password?</a></small>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Don&apos;t have an account? <a href="/register">Register</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/public/login.js"></script>
{% endblock %}
