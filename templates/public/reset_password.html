{% extends 'base.html' %}

{% block title %}Reset Password - SafeAlert{% endblock %}

{% block content %}
<div class="sa-auth-wrap">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow sa-auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center sa-icon-badge" style="background: rgba(37, 99, 235, 0.10); border-color: rgba(37, 99, 235, 0.14);">
                            <i class="bi bi-shield-lock text-primary fs-4"></i>
                        </div>
                        <h4 class="mt-3 mb-1 fw-bold">Reset Password</h4>
                        <p class="text-muted mb-0">Enter your new password below.</p>
                    </div>

                    <div id="error-message" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span id="error-text"></span>
                    </div>

                    <form id="reset-password-form">
                        <input type="hidden" id="token" value="">
                        
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="new_password" required minlength="8">
                                <button class="btn btn-outline-secondary password-toggle-btn" type="button" id="toggle-new-password" aria-label="Show new password">
                                    <i class="bi bi-eye-slash"></i>
                                </button>
                            </div>
                            <small class="form-text text-muted">Password must be at least 8 characters.</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirm_password" required>
                                <button class="btn btn-outline-secondary password-toggle-btn" type="button" id="toggle-confirm-password" aria-label="Show confirm password">
                                    <i class="bi bi-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <span class="btn-text">Reset Password</span>
                            <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted"><a href="/login">Back to Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/public/reset_password.js"></script>
{% endblock %}
