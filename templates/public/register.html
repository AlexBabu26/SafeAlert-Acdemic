{% extends 'base.html' %}

{% block title %}Register - SafeAlert{% endblock %}

{% block content %}
<div class="sa-auth-wrap">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow sa-auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center sa-icon-badge" style="background: rgba(124, 58, 237, 0.10); border-color: rgba(124, 58, 237, 0.14);">
                            <i class="bi bi-person-plus text-primary fs-4"></i>
                        </div>
                        <h4 class="mt-3 mb-1 fw-bold">Create your account</h4>
                        <p class="text-muted mb-0">Start reporting incidents securely in minutes.</p>
                    </div>

                    <form id="register-form">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="first_name" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="first_name">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="last_name" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="last_name">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="password2" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password2" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Already have an account? <a href="/login">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/public/register.js"></script>
{% endblock %}
