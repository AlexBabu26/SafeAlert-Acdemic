<script>
    // Update navbar based on auth state
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('access_token');
        const userInfo = JSON.parse(localStorage.getItem('user_info') || '{}');
        
        const isAdmin = userInfo.is_staff === true;
        const isResponder = userInfo.is_responder === true;
        const isDepartment = userInfo.is_department === true;
        
        // Hide all role-specific links initially
        const allNavItems = ['nav-user-dashboard', 'nav-new-report', 
                            'nav-responder-dashboard', 'nav-department-dashboard', 'nav-department-respondents',
                            'nav-admin-dashboard', 'nav-admin-users', 'nav-admin-analytics', 'nav-admin-categories'];
        allNavItems.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
        });
        
        if (token) {
            document.getElementById('nav-login').style.display = 'none';
            document.getElementById('nav-register').style.display = 'none';
            document.getElementById('nav-user-menu').style.display = 'block';
            document.getElementById('navbar-username').textContent = userInfo.username || 'User';
            
            // Show role badge
            const roleBadge = document.getElementById('navbar-role-badge');
            if (isAdmin) {
                roleBadge.textContent = 'Admin';
                roleBadge.className = 'badge bg-danger ms-1';
                roleBadge.style.display = 'inline';
            } else if (isDepartment) {
                roleBadge.textContent = 'Department';
                roleBadge.className = 'badge bg-warning text-dark ms-1';
                roleBadge.style.display = 'inline';
            } else if (isResponder) {
                roleBadge.textContent = 'Respondent';
                roleBadge.className = 'badge bg-info ms-1';
                roleBadge.style.display = 'inline';
            }
            
            if (isAdmin) {
                // Admin: show only admin links
                document.getElementById('nav-admin-dashboard').style.display = 'block';
                document.getElementById('nav-admin-users').style.display = 'block';
                document.getElementById('nav-admin-analytics').style.display = 'block';
                document.getElementById('nav-admin-categories').style.display = 'block';
            } else if (isDepartment) {
                // Department: show command center and respondent management
                document.getElementById('nav-department-dashboard').style.display = 'block';
                document.getElementById('nav-department-respondents').style.display = 'block';
            } else if (isResponder) {
                // Respondent: show responder dashboard
                document.getElementById('nav-responder-dashboard').style.display = 'block';
            } else {
                // Regular citizen: show user links
                document.getElementById('nav-user-dashboard').style.display = 'block';
                document.getElementById('nav-new-report').style.display = 'block';
            }
        } else {
            document.getElementById('nav-login').style.display = 'block';
            document.getElementById('nav-register').style.display = 'block';
            document.getElementById('nav-user-menu').style.display = 'none';
        }
        
        document.getElementById('logout-link')?.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user_info');
            window.location.href = '/';
        });
    });
</script>
