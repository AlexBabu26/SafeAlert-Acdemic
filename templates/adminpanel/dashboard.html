{% extends 'base.html' %}

{% block title %}Admin Dashboard - SafeAlert{% endblock %}

{% block content %}
<div class="sa-page-header">
    <div>
        <h1 class="sa-page-title"><i class="bi bi-speedometer2 me-2"></i>Admin Dashboard</h1>
        <p class="sa-page-subtitle">Review, filter, and manage incoming incident reports.</p>
    </div>
    <div class="sa-page-actions">
        <a href="/admin/categories" class="btn btn-outline-primary">
            <i class="bi bi-tags"></i> Categories
        </a>
        <a href="/admin/analytics" class="btn btn-outline-primary">
            <i class="bi bi-graph-up"></i> Analytics
        </a>
    </div>
</div>

<div class="card shadow mb-4">
    <div class="card-body p-4">
        <div class="row mb-3">
            <div class="col-md-2">
                <label class="form-label">Status</label>
                <select class="form-select" id="filter-status">
                    <option value="">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="VERIFIED">Verified</option>
                    <option value="RESOLVED">Resolved</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Category</label>
                <select class="form-select" id="filter-category">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Search</label>
                <input type="text" class="form-control" id="filter-search" placeholder="Search reports...">
            </div>
            <div class="col-md-2">
                <label class="form-label">From Date</label>
                <input type="date" class="form-control" id="filter-date-from">
            </div>
            <div class="col-md-2">
                <label class="form-label">To Date</label>
                <input type="date" class="form-control" id="filter-date-to">
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button class="btn btn-secondary w-100" id="btn-filter">Filter</button>
            </div>
        </div>
    </div>
</div>

<div id="incidents-list" class="card shadow">
    <div class="card-body p-4">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
</div>

<nav aria-label="Incidents pagination" id="pagination-nav" style="display: none;">
    <ul class="pagination justify-content-center" id="pagination">
    </ul>
</nav>
{% endblock %}

{% block extra_js %}
<script src="/static/js/adminpanel/dashboard.js"></script>
{% endblock %}
