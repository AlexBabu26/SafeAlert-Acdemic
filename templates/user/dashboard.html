{% extends 'base.html' %}

{% block title %}My Reports - SafeAlert{% endblock %}

{% block content %}
<div class="sa-page-header">
    <div>
        <h1 class="sa-page-title"><i class="bi bi-list-ul me-2"></i>My Reports</h1>
        <p class="sa-page-subtitle">Filter and track your incident reports.</p>
    </div>
    <div class="sa-page-actions">
        <a href="/report/new" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> New Report
        </a>
    </div>
</div>

<div class="card shadow mb-4">
    <div class="card-body p-4">
        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select class="form-select" id="filter-status">
                    <option value="">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="VERIFIED">Verified</option>
                    <option value="RESOLVED">Resolved</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Category</label>
                <select class="form-select" id="filter-category">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Search</label>
                <input type="text" class="form-control" id="filter-search" placeholder="Search reports...">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-secondary w-100" id="btn-filter">Filter</button>
            </div>
        </div>
    </div>
</div>

<div id="reports-list" class="card shadow">
    <div class="card-body p-4">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
</div>

<nav aria-label="Reports pagination" id="pagination-nav" style="display: none;">
    <ul class="pagination justify-content-center" id="pagination">
    </ul>
</nav>
{% endblock %}

{% block extra_js %}
<script src="/static/js/user/dashboard.js"></script>
{% endblock %}
