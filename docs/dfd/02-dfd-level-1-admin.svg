<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="950" height="550">
  <defs>
    <style>
      .entity { fill: none; stroke: #333; stroke-width: 2; }
      .process { fill: #e8f4fc; stroke: #333; stroke-width: 2; }
      .datastore { fill: none; stroke: #333; stroke-width: 2; }
      .datastore-line { stroke: #333; stroke-width: 2; }
      .arrow { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .flow-label { font-family: Arial, sans-serif; font-size: 9px; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="475" y="35" class="title" text-anchor="middle">DFD Level 1 - Admin Module</text>
  
  <!-- External Entity - Admin -->
  <rect x="30" y="230" width="100" height="50" class="entity"/>
  <text x="80" y="260" class="label" text-anchor="middle">ADMIN</text>
  
  <!-- Login Process -->
  <ellipse cx="200" cy="255" rx="50" ry="22" class="process"/>
  <text x="200" y="252" class="label" text-anchor="middle">1.0</text>
  <text x="200" y="265" class="label" text-anchor="middle">Login</text>
  
  <!-- Admin Data Store -->
  <g>
    <line x1="160" y1="340" x2="160" y2="375" class="datastore-line"/>
    <line x1="160" y1="375" x2="270" y2="375" class="datastore-line"/>
    <line x1="270" y1="340" x2="270" y2="375" class="datastore-line"/>
    <text x="215" y="362" class="label" text-anchor="middle">D1 admins</text>
  </g>
  
  <!-- Main Processes -->
  <!-- User Management -->
  <ellipse cx="400" cy="100" rx="75" ry="28" class="process"/>
  <text x="400" y="95" class="label" text-anchor="middle">1.1 User</text>
  <text x="400" y="110" class="label" text-anchor="middle">Management</text>
  
  <!-- Incident Oversight -->
  <ellipse cx="400" cy="200" rx="75" ry="28" class="process"/>
  <text x="400" y="195" class="label" text-anchor="middle">1.2 Incident</text>
  <text x="400" y="210" class="label" text-anchor="middle">Oversight</text>
  
  <!-- Department Management -->
  <ellipse cx="400" cy="300" rx="75" ry="28" class="process"/>
  <text x="400" y="295" class="label" text-anchor="middle">1.3 Department</text>
  <text x="400" y="310" class="label" text-anchor="middle">Management</text>
  
  <!-- System Analytics -->
  <ellipse cx="400" cy="400" rx="75" ry="28" class="process"/>
  <text x="400" y="395" class="label" text-anchor="middle">1.4 System</text>
  <text x="400" y="410" class="label" text-anchor="middle">Analytics</text>
  
  <!-- Category Management -->
  <ellipse cx="400" cy="490" rx="75" ry="28" class="process"/>
  <text x="400" y="485" class="label" text-anchor="middle">1.5 Category</text>
  <text x="400" y="500" class="label" text-anchor="middle">Management</text>
  
  <!-- Data Stores -->
  <!-- users -->
  <g>
    <line x1="620" y1="75" x2="620" y2="110" class="datastore-line"/>
    <line x1="620" y1="110" x2="730" y2="110" class="datastore-line"/>
    <line x1="730" y1="75" x2="730" y2="110" class="datastore-line"/>
    <text x="675" y="97" class="label" text-anchor="middle">D2 users</text>
  </g>
  
  <!-- incidents -->
  <g>
    <line x1="620" y1="175" x2="620" y2="210" class="datastore-line"/>
    <line x1="620" y1="210" x2="730" y2="210" class="datastore-line"/>
    <line x1="730" y1="175" x2="730" y2="210" class="datastore-line"/>
    <text x="675" y="197" class="label" text-anchor="middle">D3 incidents</text>
  </g>
  
  <!-- departments -->
  <g>
    <line x1="620" y1="275" x2="620" y2="310" class="datastore-line"/>
    <line x1="620" y1="310" x2="730" y2="310" class="datastore-line"/>
    <line x1="730" y1="275" x2="730" y2="310" class="datastore-line"/>
    <text x="675" y="297" class="label" text-anchor="middle">D4 departments</text>
  </g>
  
  <!-- resources -->
  <g>
    <line x1="770" y1="275" x2="770" y2="310" class="datastore-line"/>
    <line x1="770" y1="310" x2="880" y2="310" class="datastore-line"/>
    <line x1="880" y1="275" x2="880" y2="310" class="datastore-line"/>
    <text x="825" y="297" class="label" text-anchor="middle">D5 resources</text>
  </g>
  
  <!-- analytics_data -->
  <g>
    <line x1="620" y1="375" x2="620" y2="410" class="datastore-line"/>
    <line x1="620" y1="410" x2="730" y2="410" class="datastore-line"/>
    <line x1="730" y1="375" x2="730" y2="410" class="datastore-line"/>
    <text x="675" y="397" class="label" text-anchor="middle">D6 analytics</text>
  </g>
  
  <!-- categories -->
  <g>
    <line x1="620" y1="465" x2="620" y2="500" class="datastore-line"/>
    <line x1="620" y1="500" x2="730" y2="500" class="datastore-line"/>
    <line x1="730" y1="465" x2="730" y2="500" class="datastore-line"/>
    <text x="675" y="487" class="label" text-anchor="middle">D7 categories</text>
  </g>
  
  <!-- Arrows -->
  <!-- Admin to Login -->
  <path d="M130 255 L145 255" class="arrow"/>
  
  <!-- Login to admins datastore -->
  <path d="M200 277 L205 335" class="arrow"/>
  <path d="M225 355 L200 282" class="arrow"/>
  
  <!-- Login to processes -->
  <path d="M250 248 L320 115" class="arrow"/>
  <path d="M250 255 L320 200" class="arrow"/>
  <path d="M250 262 L320 295" class="arrow"/>
  <path d="M250 270 L320 390" class="arrow"/>
  <path d="M250 275 L320 480" class="arrow"/>
  
  <!-- Processes to Data Stores -->
  <path d="M475 100 L615 97" class="arrow"/>
  <path d="M475 200 L615 197" class="arrow"/>
  <path d="M475 290 L615 292" class="arrow"/>
  <path d="M475 310 L765 297" class="arrow"/>
  <path d="M475 400 L615 397" class="arrow"/>
  <path d="M475 490 L615 487" class="arrow"/>
  
  <!-- Bidirectional arrows (read) -->
  <path d="M615 102 L480 105" class="arrow"/>
  <path d="M615 202 L480 205" class="arrow"/>
</svg>
