<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="950" height="520">
  <defs>
    <style>
      .entity { fill: none; stroke: #333; stroke-width: 2; }
      .process { fill: #e8f4fc; stroke: #333; stroke-width: 2; }
      .datastore-line { stroke: #333; stroke-width: 2; }
      .arrow { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .flow-label { font-family: Arial, sans-serif; font-size: 9px; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="475" y="35" class="title" text-anchor="middle">DFD Level 1 - Citizen Module</text>
  
  <!-- External Entity - Citizen -->
  <rect x="30" y="210" width="100" height="50" class="entity"/>
  <text x="80" y="240" class="label" text-anchor="middle">CITIZEN</text>
  
  <!-- Login Process -->
  <ellipse cx="200" cy="235" rx="50" ry="22" class="process"/>
  <text x="200" y="232" class="label" text-anchor="middle">2.0</text>
  <text x="200" y="245" class="label" text-anchor="middle">Login</text>
  
  <!-- Users Data Store -->
  <g>
    <line x1="160" y1="320" x2="160" y2="355" class="datastore-line"/>
    <line x1="160" y1="355" x2="270" y2="355" class="datastore-line"/>
    <line x1="270" y1="320" x2="270" y2="355" class="datastore-line"/>
    <text x="215" y="342" class="label" text-anchor="middle">D2 users</text>
  </g>
  
  <!-- Main Processes -->
  <!-- Report Incident -->
  <ellipse cx="400" cy="90" rx="75" ry="28" class="process"/>
  <text x="400" y="85" class="label" text-anchor="middle">2.1 Report</text>
  <text x="400" y="100" class="label" text-anchor="middle">Incident</text>
  
  <!-- Track Status -->
  <ellipse cx="400" cy="180" rx="75" ry="28" class="process"/>
  <text x="400" y="175" class="label" text-anchor="middle">2.2 Track</text>
  <text x="400" y="190" class="label" text-anchor="middle">Status</text>
  
  <!-- View Profile -->
  <ellipse cx="400" cy="270" rx="75" ry="28" class="process"/>
  <text x="400" y="265" class="label" text-anchor="middle">2.3 View</text>
  <text x="400" y="280" class="label" text-anchor="middle">Profile</text>
  
  <!-- View Safety Alerts -->
  <ellipse cx="400" cy="360" rx="75" ry="28" class="process"/>
  <text x="400" y="355" class="label" text-anchor="middle">2.4 View</text>
  <text x="400" y="370" class="label" text-anchor="middle">Safety Alerts</text>
  
  <!-- Send Messages -->
  <ellipse cx="400" cy="450" rx="75" ry="28" class="process"/>
  <text x="400" y="445" class="label" text-anchor="middle">2.5 Send</text>
  <text x="400" y="460" class="label" text-anchor="middle">Messages</text>
  
  <!-- Data Stores -->
  <!-- incidents -->
  <g>
    <line x1="620" y1="65" x2="620" y2="100" class="datastore-line"/>
    <line x1="620" y1="100" x2="730" y2="100" class="datastore-line"/>
    <line x1="730" y1="65" x2="730" y2="100" class="datastore-line"/>
    <text x="675" y="87" class="label" text-anchor="middle">D3 incidents</text>
  </g>
  
  <!-- categories -->
  <g>
    <line x1="770" y1="65" x2="770" y2="100" class="datastore-line"/>
    <line x1="770" y1="100" x2="880" y2="100" class="datastore-line"/>
    <line x1="880" y1="65" x2="880" y2="100" class="datastore-line"/>
    <text x="825" y="87" class="label" text-anchor="middle">D7 categories</text>
  </g>
  
  <!-- status_history -->
  <g>
    <line x1="620" y1="155" x2="620" y2="190" class="datastore-line"/>
    <line x1="620" y1="190" x2="750" y2="190" class="datastore-line"/>
    <line x1="750" y1="155" x2="750" y2="190" class="datastore-line"/>
    <text x="685" y="177" class="label" text-anchor="middle">D8 status_history</text>
  </g>
  
  <!-- attachments -->
  <g>
    <line x1="780" y1="155" x2="780" y2="190" class="datastore-line"/>
    <line x1="780" y1="190" x2="890" y2="190" class="datastore-line"/>
    <line x1="890" y1="155" x2="890" y2="190" class="datastore-line"/>
    <text x="835" y="177" class="label" text-anchor="middle">D9 attachments</text>
  </g>
  
  <!-- users -->
  <g>
    <line x1="620" y1="245" x2="620" y2="280" class="datastore-line"/>
    <line x1="620" y1="280" x2="730" y2="280" class="datastore-line"/>
    <line x1="730" y1="245" x2="730" y2="280" class="datastore-line"/>
    <text x="675" y="267" class="label" text-anchor="middle">D2 users</text>
  </g>
  
  <!-- safety_alerts -->
  <g>
    <line x1="620" y1="335" x2="620" y2="370" class="datastore-line"/>
    <line x1="620" y1="370" x2="750" y2="370" class="datastore-line"/>
    <line x1="750" y1="335" x2="750" y2="370" class="datastore-line"/>
    <text x="685" y="357" class="label" text-anchor="middle">D10 safety_alerts</text>
  </g>
  
  <!-- messages -->
  <g>
    <line x1="620" y1="425" x2="620" y2="460" class="datastore-line"/>
    <line x1="620" y1="460" x2="730" y2="460" class="datastore-line"/>
    <line x1="730" y1="425" x2="730" y2="460" class="datastore-line"/>
    <text x="675" y="447" class="label" text-anchor="middle">D11 messages</text>
  </g>
  
  <!-- Arrows -->
  <!-- Citizen to Login -->
  <path d="M130 235 L145 235" class="arrow"/>
  
  <!-- Login to users datastore -->
  <path d="M200 257 L205 315" class="arrow"/>
  <path d="M225 335 L200 262" class="arrow"/>
  
  <!-- Login to processes -->
  <path d="M250 225 L320 105" class="arrow"/>
  <path d="M250 232 L320 182" class="arrow"/>
  <path d="M250 240 L320 268" class="arrow"/>
  <path d="M250 248 L320 355" class="arrow"/>
  <path d="M250 255 L320 445" class="arrow"/>
  
  <!-- Processes to Data Stores -->
  <path d="M475 85 L615 85" class="arrow"/>
  <path d="M475 95 L765 87" class="arrow"/>
  <path d="M475 90 L775 175" class="arrow"/>
  <path d="M475 175 L615 175" class="arrow"/>
  <path d="M615 180 L480 180" class="arrow"/>
  <path d="M475 270 L615 267" class="arrow"/>
  <path d="M615 272 L480 275" class="arrow"/>
  <path d="M475 360 L615 357" class="arrow"/>
  <path d="M615 362 L480 365" class="arrow"/>
  <path d="M475 450 L615 447" class="arrow"/>
  <path d="M615 452 L480 455" class="arrow"/>
</svg>
