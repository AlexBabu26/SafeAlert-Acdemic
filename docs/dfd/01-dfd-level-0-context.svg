<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <style>
      .entity { fill: none; stroke: #333; stroke-width: 2; }
      .process { fill: #e8f4fc; stroke: #333; stroke-width: 2; }
      .arrow { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #555; }
      .flow-label { font-family: Arial, sans-serif; font-size: 10px; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" class="title" text-anchor="middle">DFD Level 0 - Context Diagram</text>
  <text x="450" y="58" class="subtitle" text-anchor="middle">SafeAlert Emergency Reporting and Response Platform</text>
  
  <!-- External Entities -->
  <!-- Citizen -->
  <rect x="30" y="140" width="110" height="50" class="entity"/>
  <text x="85" y="170" class="label" text-anchor="middle">CITIZEN</text>
  
  <!-- Responder -->
  <rect x="30" y="360" width="110" height="50" class="entity"/>
  <text x="85" y="390" class="label" text-anchor="middle">RESPONDER</text>
  
  <!-- Department User -->
  <rect x="760" y="140" width="110" height="50" class="entity"/>
  <text x="815" y="162" class="label" text-anchor="middle">DEPARTMENT</text>
  <text x="815" y="178" class="label" text-anchor="middle">USER</text>
  
  <!-- Admin -->
  <rect x="760" y="360" width="110" height="50" class="entity"/>
  <text x="815" y="390" class="label" text-anchor="middle">ADMIN</text>
  
  <!-- Central Process -->
  <circle cx="450" cy="275" r="110" class="process"/>
  <text x="450" y="255" class="label" text-anchor="middle" font-weight="bold" font-size="14">SAFEALERT</text>
  <text x="450" y="275" class="label" text-anchor="middle">Emergency Reporting</text>
  <text x="450" y="295" class="label" text-anchor="middle">and Response System</text>
  
  <!-- Data Flows - Citizen -->
  <path d="M140 155 L330 230" class="arrow"/>
  <text x="200" y="175" class="flow-label">Incident Reports, Messages</text>
  <text x="200" y="188" class="flow-label">Profile Updates, Tracking Requests</text>
  
  <path d="M330 270 L140 175" class="arrow"/>
  <text x="195" y="245" class="flow-label">Status Updates, Safety Alerts</text>
  <text x="195" y="258" class="flow-label">Notifications, Chat Messages</text>
  
  <!-- Data Flows - Responder -->
  <path d="M140 375 L330 310" class="arrow"/>
  <text x="175" y="365" class="flow-label">Location Updates, Status Changes</text>
  <text x="175" y="378" class="flow-label">Assignment Acceptance, Messages</text>
  
  <path d="M330 320 L140 390" class="arrow"/>
  <text x="175" y="405" class="flow-label">Assignments, Incident Details</text>
  <text x="175" y="418" class="flow-label">Notifications, Navigation Data</text>
  
  <!-- Data Flows - Department User -->
  <path d="M760 155 L570 230" class="arrow"/>
  <text x="620" y="175" class="flow-label">Assignments, Alert Creation</text>
  <text x="620" y="188" class="flow-label">Escalations, Resource Updates</text>
  
  <path d="M570 270 L760 175" class="arrow"/>
  <text x="620" y="245" class="flow-label">Incident Data, Map Data</text>
  <text x="620" y="258" class="flow-label">Analytics, Responder Locations</text>
  
  <!-- Data Flows - Admin -->
  <path d="M760 375 L570 310" class="arrow"/>
  <text x="620" y="365" class="flow-label">User Management, System Config</text>
  <text x="620" y="378" class="flow-label">Department Setup, Categories</text>
  
  <path d="M570 320 L760 390" class="arrow"/>
  <text x="620" y="405" class="flow-label">System Analytics, User Data</text>
  <text x="620" y="418" class="flow-label">All Incidents, Audit Logs</text>
  
  <!-- Legend -->
  <rect x="30" y="480" width="840" height="55" fill="#f9f9f9" stroke="#ddd" rx="5"/>
  <text x="50" y="502" class="label" font-weight="bold">Legend:</text>
  <rect x="120" y="490" width="30" height="20" class="entity"/>
  <text x="160" y="505" class="label">External Entity</text>
  <circle cx="280" cy="500" r="15" class="process"/>
  <text x="305" y="505" class="label">Process</text>
  <line x1="400" y1="500" x2="450" y2="500" class="arrow"/>
  <text x="460" y="505" class="label">Data Flow</text>
</svg>
