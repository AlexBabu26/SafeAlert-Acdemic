<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <style>
      .entity { fill: none; stroke: #333; stroke-width: 2; }
      .process { fill: #e8f4fc; stroke: #333; stroke-width: 2; }
      .subprocess { fill: #f0f7e6; stroke: #333; stroke-width: 1.5; }
      .datastore-line { stroke: #333; stroke-width: 2; }
      .arrow { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .label { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .section { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #555; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="550" y="30" class="title" text-anchor="middle">DFD Level 1.1 - Admin Module Sub-processes (Merged)</text>
  
  <!-- External Entity - Admin -->
  <rect x="25" y="280" width="90" height="45" class="entity"/>
  <text x="70" y="307" class="label" text-anchor="middle">ADMIN</text>
  
  <!-- Login -->
  <ellipse cx="170" cy="302" rx="45" ry="20" class="process"/>
  <text x="170" y="306" class="label" text-anchor="middle">Login</text>
  
  <!-- ====== USER MANAGEMENT SECTION ====== -->
  <text x="350" y="60" class="section" text-anchor="middle">1.1 User Management</text>
  <rect x="250" y="70" width="200" height="110" rx="8" fill="#fafafa" stroke="#ccc" stroke-dasharray="5,3"/>
  
  <ellipse cx="300" cy="100" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="104" class="label" text-anchor="middle">View Users</text>
  
  <ellipse cx="400" cy="100" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="104" class="label" text-anchor="middle">Activate</text>
  
  <ellipse cx="300" cy="150" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="154" class="label" text-anchor="middle">Deactivate</text>
  
  <ellipse cx="400" cy="150" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="154" class="label" text-anchor="middle">Change Role</text>
  
  <!-- ====== INCIDENT OVERSIGHT SECTION ====== -->
  <text x="350" y="200" class="section" text-anchor="middle">1.2 Incident Oversight</text>
  <rect x="250" y="210" width="200" height="110" rx="8" fill="#fafafa" stroke="#ccc" stroke-dasharray="5,3"/>
  
  <ellipse cx="300" cy="240" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="244" class="label" text-anchor="middle">View All</text>
  
  <ellipse cx="400" cy="240" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="244" class="label" text-anchor="middle">Update Status</text>
  
  <ellipse cx="350" cy="290" rx="45" ry="16" class="subprocess"/>
  <text x="350" y="294" class="label" text-anchor="middle">Close Incident</text>
  
  <!-- ====== DEPARTMENT MANAGEMENT SECTION ====== -->
  <text x="350" y="345" class="section" text-anchor="middle">1.3 Department Management</text>
  <rect x="250" y="355" width="200" height="80" rx="8" fill="#fafafa" stroke="#ccc" stroke-dasharray="5,3"/>
  
  <ellipse cx="300" cy="385" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="389" class="label" text-anchor="middle">Manage Dept</text>
  
  <ellipse cx="400" cy="385" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="389" class="label" text-anchor="middle">Resources</text>
  
  <!-- ====== SYSTEM ANALYTICS & CATEGORY SECTION ====== -->
  <text x="350" y="460" class="section" text-anchor="middle">1.4 Analytics &amp; 1.5 Categories</text>
  <rect x="250" y="470" width="200" height="80" rx="8" fill="#fafafa" stroke="#ccc" stroke-dasharray="5,3"/>
  
  <ellipse cx="300" cy="500" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="504" class="label" text-anchor="middle">Analytics</text>
  
  <ellipse cx="400" cy="500" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="504" class="label" text-anchor="middle">Categories</text>
  
  <!-- ====== DATA STORES ====== -->
  <!-- D1 admins -->
  <g>
    <line x1="130" y1="380" x2="130" y2="410" class="datastore-line"/>
    <line x1="130" y1="410" x2="220" y2="410" class="datastore-line"/>
    <line x1="220" y1="380" x2="220" y2="410" class="datastore-line"/>
    <text x="175" y="400" class="label" text-anchor="middle">D1 admins</text>
  </g>
  
  <!-- D2 users -->
  <g>
    <line x1="520" y1="75" x2="520" y2="105" class="datastore-line"/>
    <line x1="520" y1="105" x2="620" y2="105" class="datastore-line"/>
    <line x1="620" y1="75" x2="620" y2="105" class="datastore-line"/>
    <text x="570" y="95" class="label" text-anchor="middle">D2 users</text>
  </g>
  
  <!-- D3 incidents -->
  <g>
    <line x1="520" y1="215" x2="520" y2="245" class="datastore-line"/>
    <line x1="520" y1="245" x2="620" y2="245" class="datastore-line"/>
    <line x1="620" y1="215" x2="620" y2="245" class="datastore-line"/>
    <text x="570" y="235" class="label" text-anchor="middle">D3 incidents</text>
  </g>
  
  <!-- D8 status_history -->
  <g>
    <line x1="520" y1="260" x2="520" y2="290" class="datastore-line"/>
    <line x1="520" y1="290" x2="640" y2="290" class="datastore-line"/>
    <line x1="640" y1="260" x2="640" y2="290" class="datastore-line"/>
    <text x="580" y="280" class="label" text-anchor="middle">D8 status_history</text>
  </g>
  
  <!-- D4 departments -->
  <g>
    <line x1="520" y1="360" x2="520" y2="390" class="datastore-line"/>
    <line x1="520" y1="390" x2="640" y2="390" class="datastore-line"/>
    <line x1="640" y1="360" x2="640" y2="390" class="datastore-line"/>
    <text x="580" y="380" class="label" text-anchor="middle">D4 departments</text>
  </g>
  
  <!-- D5 resources -->
  <g>
    <line x1="520" y1="400" x2="520" y2="430" class="datastore-line"/>
    <line x1="520" y1="430" x2="620" y2="430" class="datastore-line"/>
    <line x1="620" y1="400" x2="620" y2="430" class="datastore-line"/>
    <text x="570" y="420" class="label" text-anchor="middle">D5 resources</text>
  </g>
  
  <!-- D6 analytics -->
  <g>
    <line x1="520" y1="475" x2="520" y2="505" class="datastore-line"/>
    <line x1="520" y1="505" x2="620" y2="505" class="datastore-line"/>
    <line x1="620" y1="475" x2="620" y2="505" class="datastore-line"/>
    <text x="570" y="495" class="label" text-anchor="middle">D6 analytics</text>
  </g>
  
  <!-- D7 categories -->
  <g>
    <line x1="520" y1="515" x2="520" y2="545" class="datastore-line"/>
    <line x1="520" y1="545" x2="620" y2="545" class="datastore-line"/>
    <line x1="620" y1="515" x2="620" y2="545" class="datastore-line"/>
    <text x="570" y="535" class="label" text-anchor="middle">D7 categories</text>
  </g>
  
  <!-- ====== ARROWS ====== -->
  <!-- Admin to Login -->
  <path d="M115 302 L120 302" class="arrow"/>
  
  <!-- Login to admins -->
  <path d="M170 322 L170 375" class="arrow"/>
  <path d="M185 395 L170 327" class="arrow"/>
  
  <!-- Login to sections -->
  <path d="M215 295 L255 125" class="arrow"/>
  <path d="M215 300 L255 260" class="arrow"/>
  <path d="M215 308 L255 385" class="arrow"/>
  <path d="M215 315 L255 500" class="arrow"/>
  
  <!-- User Management to D2 users -->
  <path d="M440 100 L515 95" class="arrow"/>
  <path d="M515 100 L445 105" class="arrow"/>
  <path d="M440 150 L515 100" class="arrow"/>
  
  <!-- Incident Oversight to D3, D8 -->
  <path d="M440 240 L515 235" class="arrow"/>
  <path d="M515 240 L445 245" class="arrow"/>
  <path d="M395 306 L515 280" class="arrow"/>
  
  <!-- Department Management to D4, D5 -->
  <path d="M340 385 L515 380" class="arrow"/>
  <path d="M440 385 L515 420" class="arrow"/>
  
  <!-- Analytics & Categories to D6, D7 -->
  <path d="M340 500 L515 495" class="arrow"/>
  <path d="M440 500 L515 535" class="arrow"/>
  
  <!-- Legend -->
  <rect x="700" y="70" width="350" height="180" fill="#f9f9f9" stroke="#ddd" rx="5"/>
  <text x="875" y="95" class="section" text-anchor="middle">Legend</text>
  <rect x="720" y="110" width="30" height="20" class="entity"/>
  <text x="760" y="125" class="label">External Entity</text>
  <ellipse cx="735" cy="150" rx="15" ry="10" class="process"/>
  <text x="760" y="155" class="label">Main Process</text>
  <ellipse cx="735" cy="180" rx="15" ry="10" class="subprocess"/>
  <text x="760" y="185" class="label">Sub-process</text>
  <line x1="720" y1="210" x2="720" y2="230" class="datastore-line"/>
  <line x1="720" y1="230" x2="750" y2="230" class="datastore-line"/>
  <line x1="750" y1="210" x2="750" y2="230" class="datastore-line"/>
  <text x="760" y="225" class="label">Data Store</text>
</svg>
