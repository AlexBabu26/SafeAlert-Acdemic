<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <defs>
    <style>
      .entity { fill: none; stroke: #333; stroke-width: 2; }
      .process { fill: #e8f4fc; stroke: #333; stroke-width: 2; }
      .subprocess { fill: #f0f7e6; stroke: #333; stroke-width: 1.5; }
      .datastore-line { stroke: #333; stroke-width: 2; }
      .arrow { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .label { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .section { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #555; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="550" y="30" class="title" text-anchor="middle">DFD Level 1.1 - Responder Module Sub-processes (Merged)</text>
  
  <!-- External Entity - Responder -->
  <rect x="25" y="300" width="90" height="45" class="entity"/>
  <text x="70" y="327" class="label" text-anchor="middle">RESPONDER</text>
  
  <!-- Login -->
  <ellipse cx="170" cy="322" rx="45" ry="20" class="process"/>
  <text x="170" y="326" class="label" text-anchor="middle">Login</text>
  
  <!-- ====== ASSIGNMENT MANAGEMENT SECTION ====== -->
  <text x="350" y="55" class="section" text-anchor="middle">3.1-3.2 Assignment Management</text>
  <rect x="250" y="65" width="200" height="110" rx="8" fill="#fafafa" stroke="#ccc" stroke-dasharray="5,3"/>
  
  <ellipse cx="300" cy="95" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="99" class="label" text-anchor="middle">View Pending</text>
  
  <ellipse cx="400" cy="95" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="99" class="label" text-anchor="middle">Accept</text>
  
  <ellipse cx="300" cy="145" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="149" class="label" text-anchor="middle">View Active</text>
  
  <ellipse cx="400" cy="145" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="149" class="label" text-anchor="middle">View Completed</text>
  
  <!-- ====== STATUS UPDATES SECTION ====== -->
  <text x="350" y="200" class="section" text-anchor="middle">3.3 Status Updates</text>
  <rect x="250" y="210" width="200" height="110" rx="8" fill="#fafafa" stroke="#ccc" stroke-dasharray="5,3"/>
  
  <ellipse cx="300" cy="240" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="244" class="label" text-anchor="middle">En Route</text>
  
  <ellipse cx="400" cy="240" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="244" class="label" text-anchor="middle">On Scene</text>
  
  <ellipse cx="300" cy="290" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="294" class="label" text-anchor="middle">Resolved</text>
  
  <ellipse cx="400" cy="290" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="294" class="label" text-anchor="middle">Completed</text>
  
  <!-- ====== LOCATION SHARING SECTION ====== -->
  <text x="350" y="345" class="section" text-anchor="middle">3.4 Location Sharing</text>
  <rect x="250" y="355" width="200" height="80" rx="8" fill="#fafafa" stroke="#ccc" stroke-dasharray="5,3"/>
  
  <ellipse cx="300" cy="385" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="389" class="label" text-anchor="middle">Enable GPS</text>
  
  <ellipse cx="400" cy="385" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="389" class="label" text-anchor="middle">Update Loc</text>
  
  <!-- ====== INCIDENT DETAILS & COMMUNICATION SECTION ====== -->
  <text x="350" y="460" class="section" text-anchor="middle">3.5 View Incident &amp; Communicate</text>
  <rect x="250" y="470" width="200" height="100" rx="8" fill="#fafafa" stroke="#ccc" stroke-dasharray="5,3"/>
  
  <ellipse cx="300" cy="500" rx="40" ry="16" class="subprocess"/>
  <text x="300" y="504" class="label" text-anchor="middle">View Details</text>
  
  <ellipse cx="400" cy="500" rx="40" ry="16" class="subprocess"/>
  <text x="400" y="504" class="label" text-anchor="middle">View Media</text>
  
  <ellipse cx="350" cy="545" rx="45" ry="16" class="subprocess"/>
  <text x="350" y="549" class="label" text-anchor="middle">Send Messages</text>
  
  <!-- ====== DATA STORES ====== -->
  <!-- D2 users -->
  <g>
    <line x1="130" y1="420" x2="130" y2="450" class="datastore-line"/>
    <line x1="130" y1="450" x2="220" y2="450" class="datastore-line"/>
    <line x1="220" y1="420" x2="220" y2="450" class="datastore-line"/>
    <text x="175" y="440" class="label" text-anchor="middle">D2 users</text>
  </g>
  
  <!-- D12 assignments -->
  <g>
    <line x1="520" y1="70" x2="520" y2="100" class="datastore-line"/>
    <line x1="520" y1="100" x2="640" y2="100" class="datastore-line"/>
    <line x1="640" y1="70" x2="640" y2="100" class="datastore-line"/>
    <text x="580" y="90" class="label" text-anchor="middle">D12 assignments</text>
  </g>
  
  <!-- D13 notifications -->
  <g>
    <line x1="680" y1="70" x2="680" y2="100" class="datastore-line"/>
    <line x1="680" y1="100" x2="800" y2="100" class="datastore-line"/>
    <line x1="800" y1="70" x2="800" y2="100" class="datastore-line"/>
    <text x="740" y="90" class="label" text-anchor="middle">D13 notifications</text>
  </g>
  
  <!-- D8 status_history -->
  <g>
    <line x1="520" y1="215" x2="520" y2="245" class="datastore-line"/>
    <line x1="520" y1="245" x2="650" y2="245" class="datastore-line"/>
    <line x1="650" y1="215" x2="650" y2="245" class="datastore-line"/>
    <text x="585" y="235" class="label" text-anchor="middle">D8 status_history</text>
  </g>
  
  <!-- D3 incidents -->
  <g>
    <line x1="520" y1="260" x2="520" y2="290" class="datastore-line"/>
    <line x1="520" y1="290" x2="620" y2="290" class="datastore-line"/>
    <line x1="620" y1="260" x2="620" y2="290" class="datastore-line"/>
    <text x="570" y="280" class="label" text-anchor="middle">D3 incidents</text>
  </g>
  
  <!-- D14 location_data -->
  <g>
    <line x1="520" y1="360" x2="520" y2="390" class="datastore-line"/>
    <line x1="520" y1="390" x2="650" y2="390" class="datastore-line"/>
    <line x1="650" y1="360" x2="650" y2="390" class="datastore-line"/>
    <text x="585" y="380" class="label" text-anchor="middle">D14 location_data</text>
  </g>
  
  <!-- D9 attachments -->
  <g>
    <line x1="520" y1="475" x2="520" y2="505" class="datastore-line"/>
    <line x1="520" y1="505" x2="630" y2="505" class="datastore-line"/>
    <line x1="630" y1="475" x2="630" y2="505" class="datastore-line"/>
    <text x="575" y="495" class="label" text-anchor="middle">D9 attachments</text>
  </g>
  
  <!-- D11 messages -->
  <g>
    <line x1="520" y1="520" x2="520" y2="550" class="datastore-line"/>
    <line x1="520" y1="550" x2="620" y2="550" class="datastore-line"/>
    <line x1="620" y1="520" x2="620" y2="550" class="datastore-line"/>
    <text x="570" y="540" class="label" text-anchor="middle">D11 messages</text>
  </g>
  
  <!-- ====== ARROWS ====== -->
  <!-- Responder to Login -->
  <path d="M115 322 L120 322" class="arrow"/>
  
  <!-- Login to users -->
  <path d="M170 342 L170 415" class="arrow"/>
  <path d="M185 435 L170 347" class="arrow"/>
  
  <!-- Login to sections -->
  <path d="M215 310 L255 120" class="arrow"/>
  <path d="M215 318 L255 265" class="arrow"/>
  <path d="M215 328 L255 385" class="arrow"/>
  <path d="M215 335 L255 510" class="arrow"/>
  
  <!-- Assignment Management to Data Stores -->
  <path d="M440 95 L515 90" class="arrow"/>
  <path d="M515 95 L445 100" class="arrow"/>
  <path d="M440 120 L675 90" class="arrow"/>
  
  <!-- Status Updates to Data Stores -->
  <path d="M440 265 L515 235" class="arrow"/>
  <path d="M440 290 L515 280" class="arrow"/>
  
  <!-- Location Sharing to Data Stores -->
  <path d="M440 385 L515 380" class="arrow"/>
  
  <!-- Incident Details & Communication to Data Stores -->
  <path d="M340 500 L515 280" class="arrow"/>
  <path d="M440 500 L515 495" class="arrow"/>
  <path d="M395 545 L515 540" class="arrow"/>
  <path d="M515 545 L400 550" class="arrow"/>
  
  <!-- Legend -->
  <rect x="700" y="150" width="350" height="160" fill="#f9f9f9" stroke="#ddd" rx="5"/>
  <text x="875" y="175" class="section" text-anchor="middle">Legend</text>
  <rect x="720" y="195" width="30" height="20" class="entity"/>
  <text x="760" y="210" class="label">External Entity</text>
  <ellipse cx="735" cy="235" rx="15" ry="10" class="process"/>
  <text x="760" y="240" class="label">Main Process</text>
  <ellipse cx="735" cy="265" rx="15" ry="10" class="subprocess"/>
  <text x="760" y="270" class="label">Sub-process</text>
  <line x1="720" y1="290" x2="750" y2="290" class="arrow"/>
  <text x="760" y="295" class="label">Data Flow</text>
</svg>
